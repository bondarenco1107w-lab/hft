{"name":"Price Alerts","on":{"schedule":[{"cron":"*/5 * * * *"}],"workflow_dispatch":{}},"permissions":{"contents":"write","actions":"write"},"concurrency":{"group":"price-alerts","cancel-in-progress":false},"jobs":{"run":{"runs-on":"ubuntu-latest","timeout-minutes":7,"steps":[{"uses":"actions/checkout@v4"},{"uses":"actions/setup-python@v5","with":{"python-version":"3.11"}},{"run":"pip install requests"},{"run":"python -u alert_bot.py","env":{"BOT_TOKEN":"${{ secrets.ALERT_BOT_TOKEN }}","CHAT_ID":"${{ secrets.CHAT_ID }}"}},{"name":"Save state","if":"always()","run":"git config user.name bot && git config user.email bot@users.noreply.github.com && git add state.json && (git diff --cached --quiet || (git commit -m state && for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done))"},{"name":"Next run","if":"always()","run":"sleep 10; gh workflow run alerts.yml --ref main","env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}","GH_REPO":"${{ github.repository }}"}}]}}}
